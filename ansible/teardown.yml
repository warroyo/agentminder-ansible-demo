---
# Remove everything site.yml created.
- name: Tear down AgentMinder demo
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig | expanduser }}"
      context: "{{ kube_context | default(omit, true) }}"
    agentminder_intent: &am
      base_url: "{{ agentminder_url }}"
      tenant: "{{ agentminder_tenant }}"
      client_id: "{{ agentminder_client_id }}"
      client_secret: "{{ agentminder_client_secret }}"
      ca_cert: "{{ am_ca }}"
      validate_certs: "{{ agentminder_validate_certs }}"
    agentminder_app: *am
    agentminder_policy: *am
    agentminder_token: *am
  tasks:
    - name: Check settings
      ansible.builtin.import_tasks: tasks/preflight.yml
      tags: [always]

    - name: Delete demo namespace on the demo cluster
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ demo_namespace }}"
        state: absent
        wait: true

    - name: Delete policies
      agentminder_policy:
        name: "{{ item }}"
        state: absent
      loop:
        - "{{ policy_name }}"
        - "{{ orchestrator_name }}-client"

    # AgentMinder answers HTTP 500 for a client that recently held a
    # platform scope. It clears within a few minutes, so retry.
    - name: Delete apps
      agentminder_app:
        name: "{{ item.name }}"
        type: "{{ item.type }}"
        mcp_endpoint: unused
        state: absent
      loop:
        - {name: "{{ agent_name }}", type: agent}
        - {name: "{{ orchestrator_name }}", type: orchestrator}
        - {name: "{{ mcp_server_name }}", type: mcp_server}
      register: _delete_app
      until: _delete_app is succeeded
      retries: 30
      delay: 10

    - name: Delete intents
      agentminder_intent:
        name: "{{ item.name }}"
        state: absent
      loop: "{{ intents }}"
      loop_control:
        label: "{{ item.name }}"
