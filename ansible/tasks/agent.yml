---
# Deploy the scripted agent next to the MCP server. It only talks to the
# AgentMinder token endpoint and gateway, never to the MCP server directly.

- name: Agent config
  ansible.builtin.set_fact:
    agent_config:
      AM_URL: "{{ agentminder_url }}/{{ agentminder_tenant }}"
      GATEWAY_URL: "{{ mcp_app.gateway_url }}"
      INTENTS: "{{ agent_requested_intents | map('regex_replace', '^(?!urn:)', 'urn:iam:agent:intent:') | join(' ') }}"
      CALLS: "{{ agent_calls | to_json }}"
      INTERVAL: "{{ agent_interval_seconds }}"

- name: Agent namespace
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ demo_namespace }}"

- name: Agent credentials
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ agent_name }}-credentials"
        namespace: "{{ demo_namespace }}"
      type: Opaque
      stringData:
        client_id: "{{ agent_app.client_id }}"
        client_secret: "{{ agent_app.client_secret }}"
  no_log: true

- name: Agent code and AgentMinder CA
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ agent_name }}"
        namespace: "{{ demo_namespace }}"
      data:
        agent.py: "{{ lookup('file', app_dir ~ '/agent.py') }}"
        ca.crt: "{{ am_ca }}"

- name: Agent deployment
  kubernetes.core.k8s:
    definition: "{{ lookup('template', playbook_dir ~ '/templates/agent.yml.j2') | from_yaml }}"
    wait: true
    wait_timeout: 180
